<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System Explorer</title>
<style>
:root {
  color-scheme: dark;
  --panel: rgba(8,14,31,.85);
  --line: rgba(174,205,255,.2);
  --text: #eef4ff;
  --muted: #9eafd0;
  --accent: #7cbbff;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #030713;
  color: var(--text);
  font: 14px/1.45 system-ui, sans-serif;
}
#scene { position: fixed; inset: 0; }
canvas { display: block; }
.panel {
  position: fixed;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  backdrop-filter: blur(18px);
  box-shadow: 0 18px 60px #0005;
}
#topbar { top: 18px; left: 20px; }
.brand { font-weight: 800; letter-spacing: .06em; }
.sub { color: var(--muted); font-size: 11px; }
#controls {
  top: 100px;
  left: 20px;
  width: 230px;
  max-height: calc(100vh - 120px);
  overflow: auto;
}
#details {
  top: 20px;
  right: 20px;
  width: 280px;
  max-height: calc(100vh - 40px);
  overflow: auto;
}
.eyebrow {
  color: var(--accent);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .15em;
  text-transform: uppercase;
}
h2 { font-size: 15px; }
#object-name { font-size: 25px; margin: 8px 0 0; }
#object-type { color: var(--muted); font-size: 12px; }
#description, #fact {
  color: #c1cce3;
  font-size: 12px;
}
#planet-list { display: grid; gap: 5px; }
.planet-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: white;
  text-align: left;
  cursor: pointer;
}
.planet-btn:hover { background: #ffffff12; }
.planet-btn.active {
  background: #77b8ff1a;
  border-color: #7cbbff70;
}
.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  box-shadow: 0 0 12px currentColor;
}
.actions { display: flex; gap: 8px; margin-top: 15px; }
.action {
  flex: 1;
  padding: 10px 5px;
  background: #ffffff12;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: white;
  cursor: pointer;
}
.primary {
  background: linear-gradient(135deg,#387ed8,#7158d8);
}
.control-block {
  margin-top: 18px;
  padding-top: 15px;
  border-top: 1px solid var(--line);
}
.range-row {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 11px;
  margin-top: 12px;
}
input[type=range] {
  width: 100%;
  accent-color: var(--accent);
}
#stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 15px 0;
}
.stat {
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.stat-label {
  font-size: 10px;
  color: var(--muted);
}
.stat-value { font-size: 12px; font-weight: 700; }
#tour-status {
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  font-size: 12px;
  pointer-events: none;
}
.hint { color: var(--muted); font-size: 11px; }
@media(max-width:760px) {
  #topbar { top: 10px; left: 10px; }
  #controls {
    top: auto;
    bottom: 10px;
    left: 10px;
    width: calc(100% - 20px);
    max-height: 32vh;
  }
  #planet-list { grid-template-columns: repeat(5,1fr); }
  .planet-btn { font-size: 10px; padding: 6px 2px; }
  .dot { display: none; }
  #details {
    top: 75px;
    right: 10px;
    width: 210px;
    max-height: 35vh;
  }
  #description, #fact, #stats, .control-block {
    display: none;
  }
  #tour-status { bottom: 36vh; }
}
</style>
</head>
<body>

<div id="scene"></div>

<header id="topbar" class="panel">
  <div class="brand">✦ SOLAR SYSTEM EXPLORER</div>
  <div class="sub">An interactive 3D journey through space</div>
</header>

<aside id="controls" class="panel">
  <div class="eyebrow">Navigation</div>
  <h2>Choose a destination</h2>
  <div id="planet-list"></div>

  <div class="actions">
    <button id="tour-btn" class="action primary">
      ▶ Start tour
    </button>
    <button id="home-btn" class="action">
      ◎ Overview
    </button>
  </div>

  <div class="control-block">
    <div class="range-row">
      <label for="speed">Orbit speed</label>
      <span id="speed-value">1.0×</span>
    </div>
    <input id="speed" type="range"
      min="0" max="3" step=".1" value="1">

    <div class="range-row">
      <label for="scale">Planet size</label>
      <span id="scale-value">1.0×</span>
    </div>
    <input id="scale" type="range"
      min=".7" max="1.8" step=".1" value="1">

    <p class="hint">
      Drag to rotate · Scroll to zoom ·
      Double-click a planet to visit.
    </p>
  </div>
</aside>

<aside id="details" class="panel">
  <div class="eyebrow">Mission briefing</div>
  <h2 id="object-name">Sun</h2>
  <div id="object-type"></div>
  <p id="description"></p>
  <div id="stats"></div>
  <h3>Did you know?</h3>
  <p id="fact"></p>
</aside>

<div id="tour-status" class="panel">
  Explorer ready · Select a world
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from
  "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

// -----------------------------------------
// SOLAR SYSTEM DATA
// -----------------------------------------

const bodies = [
  {
    name: "Sun",
    type: "G2V main-sequence star",
    color: "#ff861c",
    size: 3.25,
    orbit: 0,
    speed: 0,
    diameter: "1.39 million km",
    day: "~25 Earth days",
    year: "~225 million years",
    distance: "0 km",
    description: "The gravitational heart of our solar system. Its light and heat make life on Earth possible.",
    fact: "The Sun contains about 99.86% of the solar system's mass."
  },
  {
    name: "Mercury",
    type: "Terrestrial planet",
    color: "#a8a39d",
    size: .38,
    orbit: 5.2,
    speed: .8,
    diameter: "4,879 km",
    day: "58.6 Earth days",
    year: "88 Earth days",
    distance: "57.9 million km",
    description: "A small, crater-covered world racing around the Sun.",
    fact: "Mercury has water ice in permanently shadowed polar craters."
  },
  {
    name: "Venus",
    type: "Terrestrial planet",
    color: "#e6b978",
    size: .62,
    orbit: 7.3,
    speed: .58,
    diameter: "12,104 km",
    day: "243 Earth days",
    year: "225 Earth days",
    distance: "108.2 million km",
    description: "A brilliant world wrapped in dense clouds, with an extreme greenhouse effect.",
    fact: "A day on Venus is longer than its year."
  },
  {
    name: "Earth",
    type: "Terrestrial planet",
    color: "#3d9cff",
    size: .66,
    orbit: 9.7,
    speed: .48,
    diameter: "12,742 km",
    day: "23 h 56 min",
    year: "365.25 days",
    distance: "149.6 million km",
    description: "Our ocean-rich home, and the only world currently known to support life.",
    fact: "About 71% of Earth's surface is covered by water."
  },
  {
    name: "Mars",
    type: "Terrestrial planet",
    color: "#d66c4c",
    size: .5,
    orbit: 12.4,
    speed: .39,
    diameter: "6,779 km",
    day: "24 h 37 min",
    year: "687 Earth days",
    distance: "227.9 million km",
    description: "A cold desert planet with rusty soil, ancient river valleys and giant volcanoes.",
    fact: "Olympus Mons is the tallest known volcano in the solar system."
  },
  {
    name: "Jupiter",
    type: "Gas giant",
    color: "#d7b08c",
    size: 1.55,
    orbit: 17.2,
    speed: .21,
    diameter: "139,820 km",
    day: "9 h 56 min",
    year: "11.86 Earth years",
    distance: "778.6 million km",
    description: "The largest planet, with swirling cloud bands and a powerful magnetic field.",
    fact: "Jupiter's Great Red Spot is a storm that has persisted for centuries."
  },
  {
    name: "Saturn",
    type: "Gas giant",
    color: "#e7d09a",
    size: 1.32,
    orbit: 22.1,
    speed: .15,
    diameter: "116,460 km",
    day: "10 h 33 min",
    year: "29.45 Earth years",
    distance: "1.43 billion km",
    description: "A pale-gold gas giant surrounded by spectacular icy rings.",
    fact: "Saturn is less dense than liquid water on average."
  },
  {
    name: "Uranus",
    type: "Ice giant",
    color: "#83dce4",
    size: .93,
    orbit: 27.2,
    speed: .105,
    diameter: "50,724 km",
    day: "17 h 14 min",
    year: "84 Earth years",
    distance: "2.87 billion km",
    description: "A blue-green ice giant that rotates almost on its side.",
    fact: "Uranus has an axial tilt of about 98 degrees."
  },
  {
    name: "Neptune",
    type: "Ice giant",
    color: "#4778f5",
    size: .9,
    orbit: 31.8,
    speed: .082,
    diameter: "49,244 km",
    day: "16 h 6 min",
    year: "164.8 Earth years",
    distance: "4.50 billion km",
    description: "A distant blue world with powerful winds and a dynamic atmosphere.",
    fact: "Neptune was predicted mathematically before it was observed."
  }
];

// -----------------------------------------
// SCENE, CAMERA AND RENDERER
// -----------------------------------------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040d);

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  .1,
  1500
);
camera.position.set(0, 30, 48);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;

document.getElementById("scene")
  .appendChild(renderer.domElement);

const controls = new OrbitControls(
  camera,
  renderer.domElement
);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.minDistance = 2.3;
controls.maxDistance = 100;
controls.target.set(0, 0, 0);

// -----------------------------------------
// LIGHTING
// -----------------------------------------

scene.add(new THREE.AmbientLight(0x7f9acb, .42));

const sunlight = new THREE.PointLight(
  0xffc15a, 420, 320, 1.15
);
sunlight.position.set(0, 0, 0);
scene.add(sunlight);

// -----------------------------------------
// STARFIELD
// -----------------------------------------

function createStars(count, spread, size) {
  const positions = [];

  for (let i = 0; i < count; i++) {
    const radius = THREE.MathUtils.randFloat(
      spread * .3, spread
    );
    const theta = Math.random() * Math.PI * 2;
    const u = Math.random() * 2 - 1;
    const horizontal = Math.sqrt(1 - u * u);

    positions.push(
      radius * horizontal * Math.cos(theta),
      radius * u,
      radius * horizontal * Math.sin(theta)
    );
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions, 3)
  );

  const material = new THREE.PointsMaterial({
    color: 0xdce7ff,
    size,
    transparent: true,
    opacity: .85,
    depthWrite: false
  });

  scene.add(new THREE.Points(geometry, material));
}

createStars(2600, 420, .8);
createStars(700, 260, 1.6);

// -----------------------------------------
// PLANET TEXTURES
// -----------------------------------------

function makePlanetTexture(body) {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 256;

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = body.color;
  ctx.fillRect(0, 0, 512, 256);

  for (let i = 0; i < 700; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 256;

    ctx.fillStyle = Math.random() > .5
      ? "rgba(255,255,255,.08)"
      : "rgba(0,0,0,.08)";

    ctx.beginPath();
    ctx.ellipse(
      x, y,
      Math.random() * 18 + 1,
      Math.random() * 5 + 1,
      Math.random() * Math.PI,
      0, Math.PI * 2
    );
    ctx.fill();
  }

  if (body.name === "Jupiter" ||
      body.name === "Saturn") {
    for (let y = 0; y < 256; y += 5) {
      ctx.fillStyle = Math.random() > .5
        ? "rgba(255,230,185,.12)"
        : "rgba(65,35,20,.12)";
      ctx.fillRect(0, y, 512, Math.random() * 7);
    }
  }

  if (body.name === "Jupiter") {
    ctx.fillStyle = "#b85c43";
    ctx.beginPath();
    ctx.ellipse(355, 155, 35, 16, -.1,
      0, Math.PI * 2);
    ctx.fill();
  }

  return new THREE.CanvasTexture(canvas);
}

// -----------------------------------------
// ORBIT RINGS
// -----------------------------------------

function createOrbit(radius) {
  const points = [];

  for (let i = 0; i <= 256; i++) {
    const angle = i / 256 * Math.PI * 2;
    points.push(new THREE.Vector3(
      Math.cos(angle) * radius,
      0,
      Math.sin(angle) * radius
    ));
  }

  const geometry = new THREE.BufferGeometry()
    .setFromPoints(points);

  const material = new THREE.LineBasicMaterial({
    color: 0x6c83ae,
    transparent: true,
    opacity: .25
  });

  scene.add(new THREE.LineLoop(geometry, material));
}

// -----------------------------------------
// CREATE PLANETS
// -----------------------------------------

const objects = [];
const pickables = [];

for (const body of bodies) {
  const group = new THREE.Group();
  scene.add(group);

  let material;

  if (body.name === "Sun") {
    material = new THREE.MeshBasicMaterial({
      color: body.color
    });
  } else {
    material = new THREE.MeshStandardMaterial({
      map: makePlanetTexture(body),
      roughness: .94
    });
  }

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(body.size, 48, 32),
    material
  );
  group.add(mesh);

  if (body.name === "Sun") {
    const glowCanvas = document.createElement("canvas");
    glowCanvas.width = glowCanvas.height = 256;
    const ctx = glowCanvas.getContext("2d");

    const gradient = ctx.createRadialGradient(
      128, 128, 8, 128, 128, 128
    );
    gradient.addColorStop(0, "rgba(255,230,150,1)");
    gradient.addColorStop(.3, "rgba(255,120,20,.6)");
    gradient.addColorStop(1, "rgba(255,70,10,0)");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 256, 256);

    const glow = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(glowCanvas),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      })
    );
    glow.scale.set(19, 19, 1);
    group.add(glow);
  }

  if (body.name === "Saturn" ||
      body.name === "Uranus") {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(
        body.size * 1.35,
        body.size * (body.name === "Saturn" ? 2.25 : 1.75),
        100
      ),
      new THREE.MeshStandardMaterial({
        color: body.name === "Saturn"
          ? 0xcab88d : 0x6caebd,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: body.name === "Saturn" ? .78 : .3
      })
    );
    ring.rotation.x = Math.PI / 2.35;
    mesh.add(ring);
  }

  if (body.orbit > 0) {
    createOrbit(body.orbit);
  }

  group.userData = { body, mesh };
  objects.push(group);
  pickables.push(mesh);
}

// Earth's Moon
const earth = objects.find(
  o => o.userData.body.name === "Earth"
);

const moonPivot = new THREE.Group();
earth.add(moonPivot);

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(.13, 20, 16),
  new THREE.MeshStandardMaterial({
    color: 0xb5b7bd,
    roughness: 1
  })
);
moon.position.x = 1.15;
moonPivot.add(moon);

// -----------------------------------------
// CAMERA STATE
// -----------------------------------------

const clock = new THREE.Clock();

let elapsedTime = 0;
let orbitSpeed = 1;
let sizeScale = 1;
let selected = "Sun";

let tourRunning = false;
let tourIndex = 0;
let tourElapsed = 0;

let cameraMode = "idle";
let cameraFollow = false;
let cameraDestination = null;
let cameraOffset = new THREE.Vector3();

let cameraStart = new THREE.Vector3();
let targetStart = new THREE.Vector3();
let fixedCameraEnd = new THREE.Vector3();
let fixedTargetEnd = new THREE.Vector3();

let cameraDuration = 3;
let cameraElapsed = 0;

// -----------------------------------------
// CAMERA UTILITIES
// -----------------------------------------

function worldPos(object) {
  return object.getWorldPosition(new THREE.Vector3());
}

function smoothstep5(t) {
  return t * t * t * (t * (t * 6 - 15) + 10);
}

function updateSelection(name) {
  selected = name;

  document.querySelectorAll(".planet-btn")
    .forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.name === name
      );
    });

  const body = bodies.find(b => b.name === name);
  if (!body) return;

  document.getElementById("object-name")
    .textContent = body.name;
  document.getElementById("object-type")
    .textContent = body.type;
  document.getElementById("description")
    .textContent = body.description;
  document.getElementById("fact")
    .textContent = body.fact;

  const stats = [
    ["Diameter", body.diameter],
    ["Rotation", body.day],
    ["Year", body.year],
    ["From Sun", body.distance]
  ];

  document.getElementById("stats").innerHTML =
    stats.map(([label, value]) => `
      <div class="stat">
        <div class="stat-label">${label}</div>
        <div class="stat-value">${value}</div>
      </div>
    `).join("");
}

function setStatus(message) {
  document.getElementById("tour-status")
    .textContent = message;
}

// -----------------------------------------
// SMOOTH CAMERA NAVIGATION
// -----------------------------------------

function moveCameraTo(name, duration = 3) {
  const object = objects.find(
    o => o.userData.body.name === name
  );
  if (!object) return;

  const body = object.userData.body;
  const distance = body.name === "Sun"
    ? 11
    : Math.max(body.size * 5.5, 3.8);

  const direction = new THREE.Vector3(
    .9, .55, 1
  ).normalize();

  cameraStart.copy(camera.position);
  targetStart.copy(controls.target);

  cameraOffset.copy(direction).multiplyScalar(distance);
  cameraDestination = object;
  cameraFollow = true;

  cameraDuration = duration;
  cameraElapsed = 0;
  cameraMode = "move";

  updateSelection(name);
  setStatus("Travelling to " + name);
}

function moveToOverview() {
  cameraStart.copy(camera.position);
  targetStart.copy(controls.target);

  fixedCameraEnd.set(0, 30, 48);
  fixedTargetEnd.set(0, 0, 0);

  cameraDestination = null;
  cameraFollow = false;

  cameraDuration = 2.5;
  cameraElapsed = 0;
  cameraMode = "move";

  updateSelection("Sun");
  setStatus("Solar System Overview");
}

// -----------------------------------------
// TOUR
// -----------------------------------------

function stopTour() {
  tourRunning = false;
  document.getElementById("tour-btn")
    .textContent = "▶ Start tour";
}

function startTour() {
  tourRunning = true;
  tourIndex = 0;
  tourElapsed = 0;

  document.getElementById("tour-btn")
    .textContent = "Ⅱ Pause tour";

  moveCameraTo(bodies[0].name, 2.8);
}

function nextTourDestination() {
  tourIndex++;
  tourElapsed = 0;

  if (tourIndex >= bodies.length) {
    stopTour();
    moveToOverview();
    setStatus("Tour complete");
    return;
  }

  moveCameraTo(bodies[tourIndex].name, 2.8);
}

// -----------------------------------------
// UI EVENTS
// -----------------------------------------

const list = document.getElementById("planet-list");

for (const body of bodies) {
  const button = document.createElement("button");
  button.className = "planet-btn";
  button.dataset.name = body.name;

  button.innerHTML = `
    <span class="dot" style="
      background:${body.color};
      color:${body.color}">
    </span>
    <span>${body.name}</span>
  `;

  button.addEventListener("click", () => {
    stopTour();
    moveCameraTo(body.name);
  });

  list.appendChild(button);
}

document.getElementById("tour-btn")
  .addEventListener("click", () => {
    if (tourRunning) {
      stopTour();
      setStatus("Tour paused");
    } else {
      startTour();
    }
  });

document.getElementById("home-btn")
  .addEventListener("click", () => {
    stopTour();
    moveToOverview();
  });

document.getElementById("speed")
  .addEventListener("input", event => {
    orbitSpeed = Number(event.target.value);
    document.getElementById("speed-value")
      .textContent = orbitSpeed.toFixed(1) + "×";
  });

document.getElementById("scale")
  .addEventListener("input", event => {
    sizeScale = Number(event.target.value);
    document.getElementById("scale-value")
      .textContent = sizeScale.toFixed(1) + "×";

    for (const object of objects) {
      if (object.userData.body.name !== "Sun") {
        object.userData.mesh.scale.setScalar(sizeScale);
      }
    }
  });

window.addEventListener("keydown", event => {
  if (event.code === "Space") {
    event.preventDefault();
    tourRunning ? stopTour() : startTour();
  }

  if (event.key === "0") {
    stopTour();
    moveToOverview();
  }

  if (event.key === "Escape") {
    stopTour();
  }
});

// Double-click to select planets
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

renderer.domElement.addEventListener("dblclick", event => {
  pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, true);

  if (hits.length) {
    let node = hits[0].object;

    while (node && !node.userData.body) {
      node = node.parent;
    }

    if (node?.userData?.body) {
      stopTour();
      moveCameraTo(node.userData.body.name);
    }
  }
});

// -----------------------------------------
// CAMERA TRANSITION ENGINE
// -----------------------------------------

function updateCamera(dt) {
  if (cameraMode === "move") {
    cameraElapsed += dt;

    const t = Math.min(
      cameraElapsed / cameraDuration, 1
    );

    const ease = smoothstep5(t);

    // Continuously recalculate the destination
    // while the planet moves around the Sun.
    const destination = cameraDestination
      ? worldPos(cameraDestination)
      : fixedTargetEnd.clone();

    const endpoint = cameraDestination
      ? destination.clone().add(cameraOffset)
      : fixedCameraEnd.clone();

    camera.position.lerpVectors(
      cameraStart,
      endpoint,
      ease
    );

    controls.target.lerpVectors(
      targetStart,
      destination,
      ease
    );

    if (t >= 1) {
      cameraMode = "idle";
    }

  } else if (cameraFollow && cameraDestination) {

    // Match the planet's translation exactly.
    // This prevents a positional snap on arrival.
    const position = worldPos(cameraDestination);

    const delta = position.clone()
      .sub(controls.target);

    camera.position.add(delta);
    controls.target.copy(position);
  }
}

// -----------------------------------------
// ANIMATION LOOP
// -----------------------------------------

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), .05);
  elapsedTime += dt * orbitSpeed;

  // Update planet orbits first.
  for (const object of objects) {
    const body = object.userData.body;

    if (body.orbit > 0) {
      const angle = elapsedTime * body.speed * .12;

      object.position.set(
        Math.cos(angle) * body.orbit,
        0,
        Math.sin(angle) * body.orbit
      );

      object.userData.mesh.rotation.y += dt * .2;
    } else {
      object.userData.mesh.rotation.y += dt * .025;
    }
  }

  moonPivot.rotation.y += dt * .8;

  // Update camera after planet positions.
  updateCamera(dt);

  if (tourRunning && cameraMode === "idle") {
    tourElapsed += dt;

    if (tourElapsed >= 4.2) {
      nextTourDestination();
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

// -----------------------------------------
// RESIZE
// -----------------------------------------

window.addEventListener("resize", () => {
  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

// -----------------------------------------
// START SIMULATOR
// -----------------------------------------

updateSelection("Sun");
animate();

</script>
