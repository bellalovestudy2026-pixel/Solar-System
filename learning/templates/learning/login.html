{% extends 'learning/base.html' %}
{% block title %}Log in | Study Hub{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="button" type="submit">Log in</button>
  </form>
  <p>New to Study Hub? <a href="{% url 'learning:signup' %}">Sign up</a>.</p>
</section>
{% endblock %}
